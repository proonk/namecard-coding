<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名片自动化拼版系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="bg-glow"></div>

    <main class="app-card">
        <header class="app-header">
            <div class="badge"><span class="dot"></span>PRINT STUDIO PRO</div>
            <h1>名片自动化拼版系统</h1>
            <p>上传名片正面与背面文件，秒级生成带角线出血的矢量 PDF</p>
        </header>

        <form action="/imposition" method="post" enctype="multipart/form-data" id="impositionForm">
            <!-- 纸张与出血配置 -->
            <div class="config-grid">
                <div class="form-group">
                    <label for="paper_choice">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>
                        纸张规格
                    </label>
                    <div class="select-wrapper">
                        <select name="paper_choice" id="paper_choice">
                            <option value="1">A3 横向 (20张/页)</option>
                            <option value="2">A4 竖向 (10张/页)</option>
                        </select>
                        <svg class="select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </div>
                </div>

                <div class="form-group">
                    <label for="use_bleed">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88M14.47 14.48L20 20M8.12 8.12L12 12"/></svg>
                        出血 (Bleed)
                    </label>
                    <label class="toggle-switch" for="use_bleed">
                        <input type="checkbox" name="use_bleed" id="use_bleed" value="true" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">1.5mm 出血</span>
                    </label>
                </div>
            </div>

            <!-- 文件上传面板 -->
            <div class="upload-grid">
                <!-- 正面 -->
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        名片正面图
                    </label>
                    <div class="drop-zone" id="dropZoneFront">
                        <input type="file" name="front" id="front" accept="image/*" required class="file-input">
                        <div class="drop-content">
                            <div class="icon-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                            </div>
                            <span class="drop-title">拖拽或点击上传</span>
                            <span class="file-status" id="frontFileInfo">支持 PNG / JPG</span>
                        </div>
                    </div>
                </div>

                <!-- 背面 -->
                <div class="form-group">
                    <label>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                        名片背面图
                    </label>
                    <div class="drop-zone" id="dropZoneBack">
                        <input type="file" name="back" id="back" accept="image/*" required class="file-input">
                        <div class="drop-content">
                            <div class="icon-circle">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M12 4l-4 4M12 4l4 4"/><path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                            </div>
                            <span class="drop-title">拖拽或点击上传</span>
                            <span class="file-status" id="backFileInfo">支持 PNG / JPG</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 提交按钮 -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span class="btn-text">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 10-12h-7z"/></svg>
                    立即拼版并导出 PDF
                </span>
                <span class="btn-loading d-none">
                    <svg class="spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-9-9"/></svg>
                    正在处理拼版...
                </span>
            </button>
        </form>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
